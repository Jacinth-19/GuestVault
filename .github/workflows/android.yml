name: Android CI

on:
  push:
    branches: [main, 'arena/**']
    # Docs and generated media never need a 4-emulator matrix. The media bot
    # commits under docs/media; without this every screenshot refresh would
    # re-run the whole walkthrough. Pull requests are deliberately NOT filtered,
    # so a docs change in a PR is still validated before merge.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      # The wrapper jar cannot be committed from the sandbox that generated this
      # repo, so CI bootstraps it on the first run. After that the committed
      # wrapper is used and this step is a no-op.
      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee -a build.log

      - name: Run lint
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug 2>&1 | tee -a build.log

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guestvault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Gradle wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/**
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guestvault-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # CI logs live on a storage host that some clients cannot reach. Posting
      # the tail of the build output as a commit comment makes failures
      # reviewable from anywhere the GitHub API is available.
      - name: Report failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/report_failure.py
