name: Android CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      # The wrapper jar cannot be committed from the sandbox that generated this
      # repo, so CI bootstraps it on the first run. After that the committed
      # wrapper is used and this step is a no-op.
      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guestvault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Gradle wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/**
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guestvault-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
