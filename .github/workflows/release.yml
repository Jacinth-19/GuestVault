name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Decodes the upload keystore into $RUNNER_TEMP. When the secrets are not
      # configured this is a warning, and the bundle step below is skipped so a
      # debug-signed .aab (which Play rejects outright) is never published.
      - name: Prepare upload signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: bash scripts/play/prepare-signing.sh

      - name: Build release APK and Play bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${SIGNED_FOR_PLAY:-false}" = "true" ]; then
            TASKS=":app:assembleRelease :app:assembleDebug :app:bundleRelease"
          else
            echo "::notice::Building without the upload key — APKs only, no Play bundle."
            TASKS=":app:assembleRelease :app:assembleDebug"
          fi
          gradle --no-daemon $TASKS 2>&1 | tee release-build.log

      - name: Verify the bundle is release-signed
        if: env.SIGNED_FOR_PLAY == 'true' && hashFiles('app/build/outputs/bundle/release/app-release.aab') != ''
        run: bash scripts/play/verify-signing.sh app/build/outputs/bundle/release/app-release.aab

      - name: Summarise signing
        if: always()
        run: |
          if [ "${SIGNED_FOR_PLAY:-false}" = "true" ]; then
            echo "### Signing: upload key ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "The bundle is signed with your Play upload key and can be uploaded to Play Console." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Signing: debug key ⚠️" >> "$GITHUB_STEP_SUMMARY"
            echo "No upload keystore is configured, so no Android App Bundle was published." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Google Play rejects debug-signed bundles. Create the key with:" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "bash scripts/play/create-upload-key.sh" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Manual runs pass a plain version ("1.0.0"); tag runs look like "v1.0.1".
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/GuestVault-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/GuestVault-${VERSION}-debug.apk"
          # The bundle is what Google Play accepts; the APK is for sideloading.
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ "${SIGNED_FOR_PLAY:-false}" = "true" ] && [ -f "$AAB" ]; then
            cp "$AAB" "release-assets/GuestVault-${VERSION}.aab"
            echo "SIGNING_NOTE=Play bundle included — **release-signed** with the upload key." >> "$GITHUB_ENV"
          else
            echo "SIGNING_NOTE=No Play bundle in this release: the upload key is not configured, and Google Play rejects debug-signed bundles. See \`docs/PLAY_CONSOLE.md\` → *Upload key*." >> "$GITHUB_ENV"
          fi
          ls -lh release-assets
          echo "APK_SHA=$(sha256sum release-assets/GuestVault-*.apk | grep -v debug | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: GuestVault ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## GuestVault ${{ env.VERSION }}

            **Borrow my phone. Keep your privacy.**

            Installable Android build produced by GitHub Actions.

            ### Install
            1. Download `GuestVault-${{ env.VERSION }}.apk` below.
            2. On the phone, allow installing from this source when prompted.
            3. Open GuestVault, finish onboarding, and set a 4-digit owner PIN.
            4. Pick the apps a guest may use → **Start Guest Session**.

            Requires **Android 10 (API 29) or newer**, targets Android 16 (API 36).

            ${{ env.SIGNING_NOTE }}

            ### What's inside
            - Restricted guest launcher with an app allow-list
            - PIN (PBKDF2) + optional biometric exit; the cool-down survives restarts
            - Optional session timer, screen pinning and auto-wipe
            - Session history, dark mode, and an honest limitations page
            - Permissions & privacy screen and a Quick Settings tile
            - No `INTERNET` permission, no Device Administrator, no analytics

            Screenshots and the demo video are in [`docs/media`](https://github.com/${{ github.repository }}/tree/main/docs/media).

            SHA-256 of the release APK: `${{ env.APK_SHA }}`
          files: |
            release-assets/*.apk
            release-assets/*.aab
            docs/media/preview.gif
            docs/media/walkthrough.mp4
            docs/play/icon-512.png
            docs/play/feature-graphic.png

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: ignore
