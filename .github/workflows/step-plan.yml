name: Manual Test Plan

# Grades every numbered step of the manual test plan on a real emulator.
# One `am instrument` invocation per pass, after `pm clear`, so each pass starts
# from a fresh install exactly like the plan says. The verdict table is written
# to the job summary and uploaded as an artifact; the job is red when a step
# that should have run did not pass.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/step-plan.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: step-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Numbered plan on a Pixel 6
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Build app and test APKs
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee step-plan-build.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `continue-on-error` keeps emulator cleanup hiccups from masking the
      # verdicts; the explicit gate below is what turns the job red.
      - name: Run the numbered plan
        id: plan
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: guestvault-plan
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-snapshot-save -memory 4096
          script: |
            set +e
            bash scripts/ci/run-step-plan.sh > step-plan.log 2>&1
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              echo "PLAN_FAILED=true" >> "$GITHUB_ENV"
            fi
            echo "=== step-plan.log (tail) ==="
            tail -n 160 step-plan.log
            exit 0

      - name: Publish the verdict table
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish_step_report.py

      - name: Fail on plan failures
        if: env.PLAN_FAILED == 'true'
        run: |
          echo "At least one numbered step failed or never ran. See step-report.md."
          exit 1

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-plan-verdicts
          path: |
            step-report.md
            step-plan.log
            step-plan-build.log
            build/step-results.jsonl
            build/logcat/*.txt
          if-no-files-found: warn
