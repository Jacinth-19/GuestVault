name: Manual Test Plan

# Grades every numbered step of the 14-pass manual plan on a real emulator.
#
# The plan is split into six groups, each on its own fresh emulator. A single
# 25-minute emulator session degrades (the system server gets slower, screens
# start missing input), and one long session also makes every rerun expensive.
# Each group uploads its raw verdicts; a final job merges them into one table,
# posts it as a sticky PR comment and gates the build.
#
# Within a group, phases are interleaved with host actions (`pm clear`,
# force-stop, reboot, revoke, uninstall) exactly where the plan needs them.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/step-plan.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: step-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Group ${{ matrix.group }} — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: 1, label: 'Passes 1–3' }
          - { group: 2, label: 'Passes 4–5' }
          - { group: 3, label: 'Passes 6–7' }
          - { group: 4, label: 'Passes 8–9' }
          - { group: 5, label: 'Passes 10, 11, 13, 14' }
          - { group: 6, label: 'Pass 12 (two 5-minute waits)' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Build app and test APKs
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee step-plan-build.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run group ${{ matrix.group }}
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: guestvault-plan
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-snapshot-save -memory 4096
          script: |
            set +e
            PLAN_GROUP=${{ matrix.group }} bash scripts/ci/run-step-plan.sh > step-plan.log 2>&1
            echo "=== step-plan.log (tail) ==="
            tail -n 140 step-plan.log
            exit 0

      - name: Upload this group's verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-verdicts-${{ matrix.group }}
          path: |
            build/step-results.jsonl
            build/phase-log.md
            step-plan.log
            step-plan-build.log
            build/logcat/*.txt
          if-no-files-found: warn

      - name: Report failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/report_failure.py

  report:
    name: Verdict table
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every group's verdicts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: step-verdicts-*

      - name: Merge the verdicts
        run: |
          mkdir -p build
          : > build/step-results.jsonl
          printf '| Phase | Exit | Device | Foreground window | Crash / error |\n| --- | --- | --- | --- | --- |\n' > build/phase-log.md
          shopt -s nullglob
          for f in merged/*/build/step-results.jsonl; do cat "$f" >> build/step-results.jsonl; done
          for f in merged/*/build/phase-log.md; do tail -n +3 "$f" >> build/phase-log.md; done
          echo "verdict lines: $(wc -l < build/step-results.jsonl)"

      - name: Grade the plan
        run: |
          python3 scripts/ci/step_report.py \
            --manifest scripts/ci/step-plan.json \
            --results build/step-results.jsonl \
            --phase-log build/phase-log.md \
            --out step-report.md || echo failed > report-failed.txt

      - name: Publish the verdict table
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish_step_report.py

      - name: Fail on plan failures
        if: always()
        run: |
          if [ -f report-failed.txt ]; then
            echo "::error::At least one numbered step failed or never ran. See the verdict comment."
            exit 1
          fi
          echo "Every executable step passed."

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-plan-report
          path: |
            step-report.md
            build/step-results.jsonl
            build/phase-log.md
          if-no-files-found: warn
