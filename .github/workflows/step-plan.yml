name: Manual Test Plan

# Grades every numbered step of the manual plan on a real emulator.
#
# Passes 1-14 grade the free build. Passes 15 and 16 grade the paid build on
# their own emulators, because the Pro-only screens are locked on the free one —
# and 16 changes the owner PIN, so it must not share an emulator with anything
# that expects the previous one.
#
# The plan is split into six groups, each on its own fresh emulator. A single
# 25-minute emulator session degrades (the system server gets slower, screens
# start missing input), and one long session also makes every rerun expensive.
# Each group uploads its raw verdicts; a final job merges them into one table,
# posts it as a sticky PR comment and gates the build.
#
# Within a group, phases are interleaved with host actions (`pm clear`,
# force-stop, reboot, revoke, uninstall) exactly where the plan needs them.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/step-plan.yml'

permissions:
  contents: write
  pull-requests: write
  # Explicit `permissions:` sets every unlisted scope to none, so the report
  # job's `gh run download` retry was refused with 403 and its "verdicts
  # arrived" check failed on a run where all eight artifacts were present.
  actions: read

concurrency:
  group: step-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Group ${{ matrix.group }} — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: 1, label: 'Passes 1–3', variant: free }
          - { group: 2, label: 'Passes 4–5', variant: free }
          - { group: 3, label: 'Passes 6–7', variant: free }
          - { group: 4, label: 'Passes 8–9', variant: free }
          - { group: 5, label: 'Passes 10, 11, 13, 14', variant: free }
          - { group: 6, label: 'Pass 12 (two 5-minute waits)', variant: free }
          - { group: 7, label: 'Pass 15 — the paid build', variant: pro, plan_class: ProPlanTest }
          - { group: 8, label: 'Pass 16 — paid build security', variant: pro, plan_class: ProSecurityPlanTest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Build app and test APKs
        run: |
          set -o pipefail
          # Name the variant: a bare `assembleDebug` is the aggregate task and
          # leaves both flavours' APKs in the tree, which made the runner pick
          # the wrong one.
          if [ "${{ matrix.variant }}" = "pro" ]; then
            gradle --no-daemon :app:assembleProDebug :app:assembleProDebugAndroidTest 2>&1 | tee step-plan-build.log
          else
            gradle --no-daemon :app:assembleFreeDebug :app:assembleFreeDebugAndroidTest 2>&1 | tee step-plan-build.log
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run group ${{ matrix.group }}
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: guestvault-plan
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-snapshot-save -memory 4096
          # One line, no backslash continuation: the emulator action rewrites
          # the script before running it, and a continued line came out as
          # `\ bash ...` - a command called " bash", which is exit 127 and no
          # plan at all.
          script: |
            set +e
            PLAN_GROUP=${{ matrix.group }} PLAN_VARIANT=${{ matrix.variant }} PLAN_CLASS=${{ matrix.plan_class }} PER_PASS_TIMEOUT=1200 bash scripts/ci/run-step-plan.sh > step-plan.log 2>&1
            status=$?
            echo "=== step-plan.log (tail) ==="
            tail -n 140 step-plan.log
            # Keep the run going so the other groups still report, but make the
            # job red when this group could not even set the device up: a
            # silent group would otherwise only show up as "never reported".
            if [ "$status" -ne 0 ]; then
              echo "::error::group ${{ matrix.group }} exited $status before finishing the plan"
              exit 1
            fi
            exit 0

      - name: Upload this group's verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-verdicts-${{ matrix.group }}
          path: |
            build/step-results.jsonl
            build/phase-log.md
            build/verdict-count.txt
            build/phase-count.txt
            step-plan.log
            step-plan-build.log
            build/logcat/*.txt
            build/logcat/*.logcat.txt
          if-no-files-found: warn

      # The reliable copy. The artifact below stays for the logs, but a pass
      # must not depend on blob storage being in a good mood.
      - name: Post this group's verdicts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/post_verdicts.py --group "${{ matrix.group }}"

      - name: Report failure details
        if: failure() || success()
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: |
          count="$(cat build/verdict-count.txt 2>/dev/null || echo 0)"
          phases="$(cat build/phase-count.txt 2>/dev/null || echo 0)"
          if [ "$count" -gt 0 ] && [ "$phases" -gt 0 ]; then
            echo "group $GROUP ran $phases phases and reported $count verdicts"
            exit 0
          fi
          echo "::error::group $GROUP ran $phases phases and produced $count verdicts"
          python3 scripts/ci/report_failure.py

  report:
    name: Verdict table
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every group's verdicts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: step-verdicts-*

      # Comments first, artifacts second — one group has gone missing from the
      # artifact download on three different runs, always a different group.
      - name: Collect every group's verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/fetch_verdicts.py \
            --manifest scripts/ci/step-plan.json \
            --artifacts merged \
            --results build/step-results.jsonl \
            --phases build/phase-log.md
          echo "verdict lines: $(wc -l < build/step-results.jsonl)"

      # fetch_verdicts.py already fails, naming the group, when one produced
      # nothing; this only catches a merge that wrote an empty file.
      - name: The merged results are not empty
        run: |
          lines="$(grep -c '^{' build/step-results.jsonl || true)"
          echo "verdict lines: ${lines:-0}"
          if [ "${lines:-0}" -eq 0 ]; then
            echo "::error::no verdicts were merged at all"
            exit 1
          fi

      - name: Grade the plan
        if: always()
        run: |
          python3 scripts/ci/step_report.py \
            --manifest scripts/ci/step-plan.json \
            --results build/step-results.jsonl \
            --phase-log build/phase-log.md \
            --out step-report.md || echo failed > report-failed.txt

      - name: Publish the verdict table
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish_step_report.py

      - name: Fail on plan failures
        if: always()
        run: |
          if [ -f report-failed.txt ]; then
            # A push run has no pull request to comment on, and job logs live on a
            # host that is not reachable from every environment. Annotations come
            # back through the ordinary REST API, so name the failing steps there.
            python3 scripts/ci/annotate_failures.py || true
            echo "::error::At least one numbered step failed or never ran. See the verdict comment."
            exit 1
          fi
          echo "Every executable step passed."

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-plan-report
          path: |
            step-report.md
            build/step-results.jsonl
            build/phase-log.md
          if-no-files-found: warn
