name: Play Readiness

# Guards everything Google Play rejects an app for at submission time:
#   * an Android App Bundle that actually builds and is signed
#   * release lint with zero errors
#   * a manifest that never regains the Device Admin receiver
#   * store graphics that satisfy Play's dimension / alpha rules
#   * the instrumented guest-mode walkthrough on several API levels
#
# Runs on every push, so a regression is caught long before a release tag.

on:
  push:
    # `arena/**` keeps the emulator matrix runnable from a feature branch; the
    # matrix itself is skipped for pull_request events.
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit comments carry the diagnostics; logs are not reachable everywhere

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Release bundle, lint & policy manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Build the app bundle
        run: |
          set -o pipefail
          gradle --no-daemon :app:bundleRelease 2>&1 | tee play-build.log

      - name: Lint the release variant
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintRelease 2>&1 | tee -a play-build.log

      # `lint { abortOnError = false }` keeps warnings out of the way of hotfix
      # builds; this step is the explicit gate that still refuses real errors.
      - name: Fail on lint errors
        run: |
          set -o pipefail
          python3 scripts/ci/check_lint.py app/build/reports/lint-results-release.xml \
            2>&1 | tee -a play-build.log

      - name: Upload release bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guestvault-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guestvault-lint-release
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore

      # Checks the *merged* release manifest, which is what ships. Parsing the
      # build output directly avoids depending on aapt2 or a second APK build.
      - name: Assert the shipping manifest is Play-safe
        run: |
          MANIFEST=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml \
            -newer app/build.gradle.kts 2>/dev/null | grep -i merge | head -1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merge | head -1)
          fi
          echo "merged manifest: $MANIFEST"
          cp "$MANIFEST" permissions-manifest.xml
          python3 scripts/ci/assert_play_manifest.py permissions-manifest.xml

      - name: Dump packaging metadata
        if: always()
        run: |
          ls -la app/build/outputs/bundle/release/ || true
          unzip -l app/build/outputs/bundle/release/*.aab | head -20 || true

      - name: Validate store graphics
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/ci/validate_store_assets.py

      - name: Report failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/report_failure.py

  instrumented:
    name: Guest-mode walkthrough
    # The emulator is only worth the minutes once the build is known-good, and a
    # PR does not need the full matrix on every push. The action creates and
    # boots its own AVD, so no custom avdmanager step is needed here.
    needs: bundle
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: google_apis
            profile: pixel_2
          - api: 34
            target: google_apis
            profile: pixel_6
          - api: 35
            target: google_apis
            profile: pixel_6
          - api: 36
            target: google_apis
            profile: pixel_6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Build debug + test APKs
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee -a matrix-build.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Reuses the same shell script the media workflow runs, so the matrix is
      # testing exactly the flow that produces the screenshots.
      - name: Run the instrumented walkthrough
        id: walkthrough
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: guestvault
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-snapshot-save
          script: |
            set +e
            export SKIP_MEDIA_CAPTURE=1
            bash scripts/ci/emulator-walkthrough.sh > emulator.log 2>&1
            STATUS=$?
            echo "walkthrough exit code: $STATUS"
            tail -n 80 emulator.log
            exit $STATUS

      - name: Fail on walkthrough errors
        if: steps.walkthrough.outcome == 'failure'
        run: |
          echo "The guest-mode walkthrough failed on API ${{ matrix.api }}."
          exit 1

      - name: Upload instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-api-${{ matrix.api }}
          path: |
            matrix-build.log
            emulator.log
          if-no-files-found: ignore

      - name: Report failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/report_failure.py
