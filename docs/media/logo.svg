<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108" role="img" aria-label="GuestVault">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" rx="24" fill="url(#bg)"/>
  <rect width="108" height="108" rx="24" fill="url(#sheen)"/>

  <!-- shield -->
  <path d="M54,18 L81,27.5 L81,51 C81,68 69.5,81.5 54,89 C38.5,81.5 27,68 27,51 L27,27.5 Z"
        fill="#FFFFFF"/>

  <!-- lock body -->
  <rect x="39" y="48.5" width="30" height="24" rx="5" fill="#312E81"/>
  <!-- shackle -->
  <path d="M46,48.5 L46,43 A8,8 0 0 1 62,43 L62,48.5"
        fill="none" stroke="#312E81" stroke-width="4.6" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="54" cy="57.5" r="3.1" fill="#FFFFFF"/>
  <rect x="52.6" y="60.5" width="2.8" height="6.5" rx="1.2" fill="#FFFFFF"/>
</svg>
